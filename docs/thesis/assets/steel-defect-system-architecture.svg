<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:40px;font-weight:700;fill:#111}
      .layer-title{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:28px;font-weight:700;fill:#111}
      .box-title{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:25px;font-weight:700;fill:#111}
      .box-text{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:20px;fill:#222}
      .label{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:19px;fill:#111;font-weight:700}
      .layer{fill:#f7f7f7;stroke:#222;stroke-width:2}
      .node{fill:#fff;stroke:#333;stroke-width:1.7}
      .store{fill:#fff;stroke:#111;stroke-width:2}
      .line{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="20" y="20" width="1760" height="940" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="900" y="72" text-anchor="middle" class="title">钢材表面缺陷检测系统整体架构图</text>

  <!-- Layers -->
  <rect x="70" y="110" width="1660" height="160" class="layer"/>
  <rect x="70" y="305" width="1660" height="180" class="layer"/>
  <rect x="70" y="520" width="1660" height="160" class="layer"/>
  <rect x="70" y="715" width="1660" height="170" class="layer"/>

  <text x="108" y="155" class="layer-title">前端交互层</text>
  <text x="108" y="355" class="layer-title">后端业务服务层</text>
  <text x="108" y="570" class="layer-title">算法推理层</text>
  <text x="108" y="765" class="layer-title">数据持久层</text>

  <!-- Frontend nodes -->
  <g id="frontend">
    <rect x="285" y="140" width="230" height="90" class="node"/>
    <text x="400" y="178" text-anchor="middle" class="box-title">登录注册</text>
    <text x="400" y="208" text-anchor="middle" class="box-text">账户注册 / 登录认证</text>

    <rect x="555" y="140" width="230" height="90" class="node"/>
    <text x="670" y="178" text-anchor="middle" class="box-title">缺陷检测</text>
    <text x="670" y="208" text-anchor="middle" class="box-text">图片上传 / 结果展示</text>

    <rect x="825" y="140" width="230" height="90" class="node"/>
    <text x="940" y="178" text-anchor="middle" class="box-title">历史记录</text>
    <text x="940" y="208" text-anchor="middle" class="box-text">记录列表 / 详情查看</text>

    <rect x="1095" y="140" width="230" height="90" class="node"/>
    <text x="1210" y="178" text-anchor="middle" class="box-title">统计分析</text>
    <text x="1210" y="208" text-anchor="middle" class="box-text">趋势统计 / 类别分布</text>

    <rect x="1365" y="140" width="230" height="90" class="node"/>
    <text x="1480" y="178" text-anchor="middle" class="box-title">模型管理</text>
    <text x="1480" y="208" text-anchor="middle" class="box-text">模型上传 / 模型选择</text>
  </g>

  <!-- Backend nodes -->
  <g id="backend">
    <rect x="285" y="350" width="230" height="90" class="node"/>
    <text x="400" y="388" text-anchor="middle" class="box-title">认证模块</text>
    <text x="400" y="418" text-anchor="middle" class="box-text">注册 / 登录 / Token</text>

    <rect x="555" y="350" width="230" height="90" class="node"/>
    <text x="670" y="388" text-anchor="middle" class="box-title">检测模块</text>
    <text x="670" y="418" text-anchor="middle" class="box-text">任务接收 / 结果封装</text>

    <rect x="825" y="350" width="230" height="90" class="node"/>
    <text x="940" y="388" text-anchor="middle" class="box-title">历史记录模块</text>
    <text x="940" y="418" text-anchor="middle" class="box-text">查询 / 分页 / 详情</text>

    <rect x="1095" y="350" width="230" height="90" class="node"/>
    <text x="1210" y="388" text-anchor="middle" class="box-title">统计分析模块</text>
    <text x="1210" y="418" text-anchor="middle" class="box-text">聚合分析 / 图表数据</text>

    <rect x="1365" y="350" width="230" height="90" class="node"/>
    <text x="1480" y="388" text-anchor="middle" class="box-title">模型管理模块</text>
    <text x="1480" y="418" text-anchor="middle" class="box-text">元数据 / 权重管理</text>
  </g>

  <!-- Algorithm nodes -->
  <g id="algorithm">
    <rect x="360" y="560" width="250" height="80" class="node"/>
    <text x="485" y="593" text-anchor="middle" class="box-title">YOLOv8s基线模型</text>
    <text x="485" y="622" text-anchor="middle" class="box-text">基础检测网络</text>

    <rect x="660" y="560" width="250" height="80" class="node"/>
    <text x="785" y="593" text-anchor="middle" class="box-title">CBAM改进模型</text>
    <text x="785" y="622" text-anchor="middle" class="box-text">注意力增强检测</text>

    <rect x="960" y="560" width="250" height="80" class="node"/>
    <text x="1085" y="593" text-anchor="middle" class="box-title">模型加载与缓存</text>
    <text x="1085" y="622" text-anchor="middle" class="box-text">权重加载 / 实例复用</text>

    <rect x="1260" y="560" width="250" height="80" class="node"/>
    <text x="1385" y="593" text-anchor="middle" class="box-title">单图 / 批量推理</text>
    <text x="1385" y="622" text-anchor="middle" class="box-text">前处理 / 推理 / 后处理</text>
  </g>

  <!-- Data nodes -->
  <g id="data">
    <rect x="390" y="760" width="430" height="85" class="store"/>
    <text x="605" y="792" text-anchor="middle" class="box-title">MySQL数据库</text>
    <text x="605" y="823" text-anchor="middle" class="box-text">用户信息 / 检测记录 / 模型元数据</text>

    <rect x="980" y="760" width="500" height="85" class="store"/>
    <text x="1230" y="792" text-anchor="middle" class="box-title">文件系统</text>
    <text x="1230" y="823" text-anchor="middle" class="box-text">上传图片 / 标注结果 / .pt模型文件</text>
  </g>

  <!-- Frontend to backend -->
  <path d="M400 230 L400 350" class="line"/>
  <path d="M670 230 L670 350" class="line"/>
  <path d="M940 230 L940 350" class="line"/>
  <path d="M1210 230 L1210 350" class="line"/>
  <path d="M1480 230 L1480 350" class="line"/>
  <text x="900" y="292" text-anchor="middle" class="label">HTTP API 调用</text>

  <!-- Backend to algorithm -->
  <path d="M670 440 C670 500 1320 500 1385 560" class="line"/>
  <text x="920" y="505" text-anchor="middle" class="label">检测模块调用算法推理层</text>
  <path d="M1480 440 C1480 495 1135 508 1085 560" class="dash"/>
  <text x="1380" y="510" text-anchor="middle" class="label">模型选择 / 加载</text>

  <!-- Algorithm inner calls -->
  <path d="M610 600 L660 600" class="line"/>
  <path d="M910 600 L960 600" class="line"/>
  <path d="M1210 600 L1260 600" class="line"/>

  <!-- Backend to DB -->
  <path d="M400 440 C400 620 510 655 605 760" class="line"/>
  <path d="M670 440 C670 610 635 655 605 760" class="line"/>
  <path d="M940 440 C940 605 725 660 605 760" class="line"/>
  <path d="M1210 440 C1210 605 790 665 605 760" class="line"/>
  <path d="M1480 440 C1480 615 870 670 605 760" class="line"/>
  <text x="510" y="705" text-anchor="middle" class="label">读写数据库</text>

  <!-- Backend/AI to filesystem -->
  <path d="M670 440 C800 575 980 650 1230 760" class="line"/>
  <path d="M1480 440 C1520 585 1390 675 1230 760" class="line"/>
  <path d="M1085 640 C1095 690 1155 720 1230 760" class="dash"/>
  <path d="M1385 640 C1380 690 1320 725 1230 760" class="dash"/>
  <text x="1395" y="705" text-anchor="middle" class="label">读写文件资源</text>

  <!-- Legend -->
  <rect x="70" y="905" width="1660" height="35" fill="#fff" stroke="none"/>
  <text x="900" y="930" text-anchor="middle" class="box-text">说明：实线箭头表示主要业务调用与数据读写关系；虚线箭头表示模型加载、缓存及文件资源访问关系。</text>
</svg>
