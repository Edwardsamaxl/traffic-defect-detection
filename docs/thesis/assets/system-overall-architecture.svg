<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;dominant-baseline:middle}.small{font-size:15px}</style>
