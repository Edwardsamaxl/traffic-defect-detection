<text x="172" y="634" font-size="15" font-weight="400" text-anchor="middle" fill="#ffffff">承载核心业务逻辑</text>
<text x="172" y="654" font-size="15" font-weight="400" text-anchor="middle" fill="#ffffff">与检测流程</text>
<rect x="70" y="850" width="1660" height="190" rx="28" fill="#fff3e6" stroke="#b85a12" stroke-width="3"/>
