<rect width="1800" height="1120" fill="#f7f8fb"/>
<text x="900" y="60" font-size="42" font-weight="700" text-anchor="middle" fill="#1e293b">钢材表面缺陷检测系统整体架构图</text>
<text x="900" y="105" font-size="18" font-weight="400" text-anchor="middle" fill="#5b6472">以三层职责划分为主线，突出界面交互、业务编排、模型检测与数据持久化之间的协作关系</text>
