<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f3a45"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #15202b; }
      .subtitle { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #52616f; }
      .box-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #15202b; }
      .box-text { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263442; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5b6978; }
      .code { font: 15px Consolas, "Courier New", monospace; fill: #1d2730; }
      .arrow { stroke: #2f3a45; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8a97a6; stroke-width: 2; stroke-dasharray: 6 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="760" fill="#f6f8fb"/>

  <text x="740" y="48" text-anchor="middle" class="title">统计分析模块实现流程与返回示例图</text>
  <text x="740" y="76" text-anchor="middle" class="subtitle">从仪表盘请求到 detection_records 聚合，再到前端指标卡、折线图和环形图展示</text>

  <rect x="46" y="118" width="230" height="122" rx="10" fill="#fff8e1" stroke="#a66a00" stroke-width="2"/>
  <text x="161" y="153" text-anchor="middle" class="box-title">注册用户</text>
  <text x="161" y="185" text-anchor="middle" class="box-text">进入仪表盘页面</text>
  <text x="161" y="212" text-anchor="middle" class="small">已完成登录注册</text>

  <rect x="330" y="118" width="265" height="122" rx="10" fill="#e8f3ff" stroke="#2364aa" stroke-width="2"/>
  <text x="462" y="153" text-anchor="middle" class="box-title">前端 Dashboard 页面</text>
  <text x="462" y="185" text-anchor="middle" class="box-text">GET /api/dashboard/stats</text>
  <text x="462" y="212" text-anchor="middle" class="small">携带 Authorization Token</text>

  <rect x="652" y="118" width="220" height="122" rx="10" fill="#eef8ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="762" y="153" text-anchor="middle" class="box-title">后端 JWT 校验</text>
  <text x="762" y="185" text-anchor="middle" class="box-text">验证 Token 有效性</text>
  <text x="762" y="212" text-anchor="middle" class="small">解析当前 user_id</text>

  <rect x="930" y="118" width="230" height="122" rx="10" fill="#eef8ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="1045" y="153" text-anchor="middle" class="box-title">Dashboard 模块</text>
  <text x="1045" y="185" text-anchor="middle" class="box-text">按用户查询统计数据</text>
  <text x="1045" y="212" text-anchor="middle" class="small">限定当前用户记录范围</text>

  <rect x="1214" y="118" width="220" height="122" rx="10" fill="#f7f7f7" stroke="#333333" stroke-width="2"/>
  <text x="1324" y="153" text-anchor="middle" class="box-title">detection_records 表</text>
  <text x="1324" y="185" text-anchor="middle" class="box-text">user_id / created_at</text>
  <text x="1324" y="212" text-anchor="middle" class="small">detections JSON 检测结果</text>

  <path class="arrow" d="M276 179 H320"/>
  <path class="arrow" d="M595 179 H642"/>
  <path class="arrow" d="M872 179 H920"/>
  <path class="arrow" d="M1160 179 H1204"/>

  <rect x="140" y="310" width="505" height="176" rx="10" fill="#eef8ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="392" y="346" text-anchor="middle" class="box-title">聚合计算</text>
  <text x="178" y="382" class="box-text">1. 累计检测次数：total</text>
  <text x="178" y="412" class="box-text">2. 今日检测次数：today</text>
  <text x="178" y="442" class="box-text">3. 过去 7 天每日检测次数：by_day</text>
  <text x="178" y="472" class="box-text">4. 过去 7 天缺陷类别分布：by_class</text>

  <path class="arrow" d="M1324 240 V284 H392 V300"/>

  <rect x="720" y="292" width="420" height="248" rx="10" fill="#fff0f0" stroke="#b33a3a" stroke-width="2"/>
  <text x="930" y="328" text-anchor="middle" class="box-title">返回 JSON 数据示例</text>
  <text x="760" y="364" class="code">{</text>
  <text x="782" y="392" class="code">"total": 128,</text>
  <text x="782" y="420" class="code">"today": 6,</text>
  <text x="782" y="448" class="code">"daily_avg": 18.3,</text>
  <text x="782" y="476" class="code">"by_day": [{"date": "2026-05-10", "count": 12}],</text>
  <text x="782" y="504" class="code">"by_class": [{"class": "crazing", "count": 21}]</text>
  <text x="760" y="532" class="code">}</text>

  <path class="arrow" d="M645 398 H710"/>

  <rect x="830" y="612" width="190" height="80" rx="10" fill="#e8f3ff" stroke="#2364aa" stroke-width="2"/>
  <text x="925" y="644" text-anchor="middle" class="box-title">指标卡</text>
  <text x="925" y="672" text-anchor="middle" class="small">total / today / daily_avg</text>

  <rect x="1056" y="612" width="170" height="80" rx="10" fill="#e8f3ff" stroke="#2364aa" stroke-width="2"/>
  <text x="1141" y="644" text-anchor="middle" class="box-title">折线图</text>
  <text x="1141" y="672" text-anchor="middle" class="small">by_day</text>

  <rect x="1262" y="612" width="170" height="80" rx="10" fill="#e8f3ff" stroke="#2364aa" stroke-width="2"/>
  <text x="1347" y="644" text-anchor="middle" class="box-title">环形图</text>
  <text x="1347" y="672" text-anchor="middle" class="small">by_class</text>

  <path class="dash" d="M930 540 V602"/>
  <path class="dash" d="M980 540 C1040 574, 1094 574, 1141 602"/>
  <path class="dash" d="M1035 540 C1155 578, 1270 578, 1347 602"/>

  <path class="arrow" d="M720 514 C595 580, 506 588, 462 250"/>
  <text x="555" y="594" class="small">HTTP 200 application/json 返回前端渲染</text>
</svg>
