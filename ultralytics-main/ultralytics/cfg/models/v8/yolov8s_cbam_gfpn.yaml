# Ultralytics YOLOv8s + CBAM (Backbone) + BiFPN Neck
#
# CBAM: Convolutional Block Attention Module (backbone)
# BiFPN: Weighted Feature Pyramid Network (neck)

# Parameters
nc: 6
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone with CBAM
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2  640->320
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4  320->160
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, CBAM, []] # 3

  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8  160->80
  - [-1, 6, C2f, [256, True]] # 5
  - [-1, 1, CBAM, []] # 6

  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16  80->40
  - [-1, 6, C2f, [512, True]] # 8
  - [-1, 1, CBAM, []] # 9

  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32  40->20
  - [-1, 3, C2f, [1024, True]] # 11
  - [-1, 1, SPPF, [1024, 5]] # 12

# BiFPN Neck - Top-down then bottom-up weighted fusion
# Input: [P3=5, P4=8, P5=11] channels [256, 512, 1024]
head:
  # Top-down path: P5 -> P4 -> P3
  - [-1, 1, Conv, [512, 1, 1]] # 13 reduce P5 to 512
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 upsample P5

  # P4 fusion: P4 + upsampled P5
  - [[8, 14], 1, BiFPN_Add2, []] # 15 weighted fusion [P4=512, P5_up=512]
  - [-1, 3, C2f, [512]] # 16 fused P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 upsample fused P4

  # P3 fusion: P3 + upsampled fused P4
  - [[5, 17], 1, BiFPN_Add2, []] # 18 weighted fusion [P3=256, P4_up=256]
  - [-1, 3, C2f, [256]] # 19 fused P3

  # Bottom-up path: P3 -> P4 -> P5
  - [-1, 1, Conv, [256, 3, 2]] # 20 downsample fused P3

  # P4 bottom-up: fused P4 + downsampled P3
  - [[16, 20], 1, BiFPN_Add2, []] # 21 weighted fusion [fused P4=512, P3_down=256]
  - [-1, 3, C2f, [512]] # 22 bottom-up P4

  - [-1, 1, Conv, [512, 3, 2]] # 23 downsample bottom-up P4

  # P5 bottom-up: reduced P5 + downsampled bottom-up P4
  - [[13, 23], 1, BiFPN_Add2, []] # 24 weighted fusion [P5_red=512, P4_down=512]
  - [-1, 3, C2f, [1024]] # 25 bottom-up P5

  # Detect: [P3_fused=19, P4_bu=22, P5_bu=25]
  - [[19, 22, 25], 1, Detect, [nc]] # 26
