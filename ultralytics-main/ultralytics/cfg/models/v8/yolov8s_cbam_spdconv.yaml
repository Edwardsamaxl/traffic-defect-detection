# Ultralytics YOLOv8s + CBAM + SPD-Conv 实验配置
#
# SPD-Conv 论文: "No More Strided Convolutions" (ECML PKDD 2022)
# https://arxiv.org/pdf/2208.03641
#
# 实验: 将 backbone 前两层下采样替换为 SPD-Conv，保持 CBAM

# Parameters
nc: 6 # number of classes (NEU-DET: 6 defect types)
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone with CBAM + SPD-Conv
backbone:
  # 第0层: 标准 Conv 640→320
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2

  # 第1层: SPDConv 320→160
  # SPDConv(c2=128, k=3, s=2, scale=2)
  - [-1, 1, SPDConv, [128, 3, 2, 2]] # 1-P2/4

  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, CBAM, []] # 3

  # 第4层: SPDConv 160→80
  # SPDConv(c2=256, k=3, s=2, scale=2)
  - [-1, 1, SPDConv, [256, 3, 2, 2]] # 4-P3/8

  - [-1, 6, C2f, [256, True]] # 5
  - [-1, 1, CBAM, []] # 6

  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f, [512, True]] # 8
  - [-1, 1, CBAM, []] # 9

  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f, [1024, True]] # 11
  - [-1, 1, SPPF, [1024, 5]] # 12

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 8], 1, Concat, [1]] # 14
  - [-1, 3, C2f, [512]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 5], 1, Concat, [1]] # 17
  - [-1, 3, C2f, [256]] # 18

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20
  - [-1, 3, C2f, [512]] # 21

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23
  - [-1, 3, C2f, [1024]] # 24

  - [[18, 21, 24], 1, Detect, [nc]] # 25
